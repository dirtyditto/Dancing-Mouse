name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS 14 / Swift 5.9)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: make app
