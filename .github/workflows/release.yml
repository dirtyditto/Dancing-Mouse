name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build .app, package DMG, publish release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Resolve version from tag
        id: version
        run: |
          # GITHUB_REF_NAME is e.g. "v1.2.3"; strip the leading "v".
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build .app + DMG
        run: make dmg

      - name: Rename DMG to match tag
        id: dmg
        run: |
          # create-dmg.sh emits build/DancingMouse-1.0.0.dmg; rename to the tag.
          SRC=$(ls build/DancingMouse-*.dmg | head -n 1)
          DEST="build/DancingMouse-${{ steps.version.outputs.version }}.dmg"
          if [ "$SRC" != "$DEST" ]; then
            mv "$SRC" "$DEST"
          fi
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$DEST" | tee "$DEST.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dancing Mouse ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          body: |
            ## Install

            ### Homebrew

            ```bash
            brew tap ${{ github.repository_owner }}/dancing-mouse https://github.com/${{ github.repository }}
            brew install --cask dancing-mouse
            ```

            ### Direct download

            1. Download `DancingMouse-${{ steps.version.outputs.version }}.dmg` below.
            2. Open it and drag **Dancing Mouse** to `/Applications`.
            3. On first launch, grant Accessibility permission in
               *System Settings → Privacy & Security → Accessibility*, then relaunch.

            > This build is **ad-hoc signed**, not notarized.
            > macOS may warn on first open — right-click the app and choose **Open**
            > to bypass Gatekeeper, or remove the quarantine attribute:
            >
            > ```bash
            > xattr -dr com.apple.quarantine "/Applications/Dancing Mouse.app"
            > ```

      - name: Bump Homebrew Cask on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail

          # Fresh clone of main in a sibling dir so we don't touch the build tree.
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" cask-update
          cd cask-update

          CASK="Casks/dancing-mouse.rb"
          if [ ! -f "$CASK" ]; then
            echo "::notice::No Casks/dancing-mouse.rb found on main — skipping cask bump."
            exit 0
          fi

          SHA=$(awk '{print $1}' "../${DMG_PATH}.sha256")

          # Rewrite version, sha256, and the GitHub URL/homepage so the cask
          # always points at this repo regardless of the placeholder it shipped with.
          sed -i.bak -E "s|^([[:space:]]*version )\".*\"|\1\"${VERSION}\"|"                                "$CASK"
          sed -i.bak -E "s|^([[:space:]]*sha256 ).*|\1\"${SHA}\"|"                                          "$CASK"
          sed -i.bak -E "s|github\.com/[^/\"]+/[^/\"]+/releases|github.com/${REPO}/releases|g"              "$CASK"
          sed -i.bak -E "s|homepage \"https://github\.com/[^\"]+\"|homepage \"https://github.com/${REPO}\"|" "$CASK"
          rm -f "$CASK.bak"

          if git diff --quiet -- "$CASK"; then
            echo "Cask already up to date — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "227273842+dirtyditto@users.noreply.github.com"
          git add "$CASK"
          git commit -m "chore(cask): bump dancing-mouse to ${VERSION} [skip ci]"
          git push origin main
